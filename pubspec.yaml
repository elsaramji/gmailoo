name: gmailoo
description: "An ephemeral, stress-free email client for Gen Z and Gen Alpha."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture, State Management & DI
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  equatable: 2.1.0
  fpdart: ^1.2.0

  # Navigation & Routing
  go_router: ^18.0.2

  # Persistence & Secure Storage
  drift: ^2.35.1
  sqlite3: ^3.7.0
  sqlcipher_flutter_libs: ^0.7.0+eol
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1

  # Authentication & Google / Gmail APIs
  # firebase_core: ^4.15.0
  # firebase_auth: ^6.7.0
  # google_sign_in: ^7.2.0
  # googleapis: ^17.0.0
  # extension_google_sign_in_as_googleapis_auth: ^3.0.0
  # http: ^1.6.0

  # Push Notifications & Background Scheduling
  # firebase_messaging: ^16.7.0
  # flutter_local_notifications: ^22.3.1
  # workmanager: ^0.10.10

  # Time, Timezone & Localization
  #timezone: ^0.11.1
  #flutter_timezone: ^5.1.0
  intl: ^0.20.3

  # Content Rendering, MIME Handling & Utilities
 # webview_flutter: ^4.14.1
  # html: ^0.15.7
  #crypto: ^3.0.7
  #uuid: ^4.6.0
  #mime: ^2.1.0
  #url_launcher: ^6.3.2

  # Design System, Typography & Iconography
  cupertino_icons: ^1.0.9
  flutter_screenutil_plus: ^1.6.0
  material_symbols_icons: ^4.2960.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  injectable_generator: ^3.1.3
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  alchemist: ^0.14.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true # Enables automatic flutter gen-l10n

  assets:
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
